sonar.tests=apps,packages

sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts

sonar.exclusions=design_review/**,node_modules/**,.next/**,**/.next/**,dist/**,**/dist/**,build/**,**/build/**,coverage/**,**/coverage/**,package-lock.json,**/*.tsbuildinfo,**/prisma/migrations/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts

sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts,**/prisma/migrations/**
sonar.cpd.exclusions=design_review/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts,**/prisma/migrations/**
