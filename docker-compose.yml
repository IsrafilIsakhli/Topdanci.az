services:
  postgres:
    image: postgres:16-alpine
    container_name: topdanbazar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: topdanbazar
      POSTGRES_PASSWORD: topdanbazar
      POSTGRES_DB: topdanbazar
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topdanbazar -d topdanbazar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: topdanbazar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: topdanbazar-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: topdanbazar-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://topdanbazar:topdanbazar@postgres:5432/topdanbazar?schema=public
      REDIS_URL: redis://redis:6379
      API_ORIGIN: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    image: topdanbazar-migrate:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: topdanbazar-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://topdanbazar:topdanbazar@postgres:5432/topdanbazar?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/prisma/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: topdanbazar-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: topdanbazar-web
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
