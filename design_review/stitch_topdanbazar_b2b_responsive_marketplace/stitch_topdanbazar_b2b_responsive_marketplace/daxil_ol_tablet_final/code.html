</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="login-password">Şifrə</label>
<input class="border border-outline-variant rounded-DEFAULT p-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-surface-bright" id="login-password" placeholder="Şifrənizi daxil edin" type="password"/>
</div>
<div class="flex justify-between items-center mt-xs">
<label class="flex items-center gap-sm cursor-pointer">

<span class="font-body-sm text-body-sm text-on-surface-variant">Məni yadda saxla</span>
