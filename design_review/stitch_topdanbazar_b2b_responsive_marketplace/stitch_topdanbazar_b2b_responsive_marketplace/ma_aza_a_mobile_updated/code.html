<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<header class="bg-surface-container-lowest sticky top-0 z-50 shadow-sm px-lg h-20 flex items-center justify-between border-b border-outline-variant/30">
<a aria-label="Menu" class="flex items-center text-primary" href="#">
<span class="material-symbols-outlined">menu</span>
</a>
<div class="flex-grow flex justify-center">
<span class="font-h3 text-h3 text-primary">TopdanBazar</span>
</div>
<div class="w-6"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow flex flex-col pb-xxl">
<!-- Hero Section -->
<section class="bg-surface-container px-lg py-xl flex flex-col items-center text-center">
<div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<h1 class="font-h1 text-h2 text-on-background mb-sm">Mağaza müraciəti</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md">TopdanBazar-da öz topdansatış mağazanızı yaradın və minlərlə alıcıya çıxış əldə edin.</p>
</section>
<!-- Form Section -->
<section class="px-lg py-lg bg-surface-container-lowest flex-grow flex flex-col items-center">
<div class="w-full max-w-md">
<form class="space-y-lg w-full flex flex-col">
<!-- Company Info Group -->
<div class="space-y-md">
<h2 class="font-h3 text-h3 text-primary border-b border-outline-variant/30 pb-xs mb-md">Şirkət Məlumatları</h2>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="companyName">ŞİRKƏTİN ADI *</label>
<input class="w-full h-14 bg-surface rounded-DEFAULT border border-outline-variant px-md font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="companyName" placeholder="Məsələn: Baku Wholesale MMC" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="voen">VÖEN *</label>
<input class="w-full h-14 bg-surface rounded-DEFAULT border border-outline-variant px-md font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="voen" placeholder="VÖEN nömrənizi daxil edin" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="category">ƏSAS KATEQORİYA *</label>
<div class="relative">
<select class="w-full h-14 bg-surface rounded-DEFAULT border border-outline-variant px-md font-body-md text-body-md text-on-background appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="category">
<option disabled="" selected="" value="">Kategoriya seçin</option>
<option value="electronics">Elektronika</option>
<option value="clothing">Geyim</option>
<option value="food">Qida məhsulları</option>
<option value="materials">Tikinti materialları</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 transform -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Contact Info Group -->
<div class="space-y-md pt-md">
<h2 class="font-h3 text-h3 text-primary border-b border-outline-variant/30 pb-xs mb-md">Əlaqə Məlumatları</h2>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="contactName">ƏLAQƏLƏNDİRİCİ ŞƏXS *</label>
<input class="w-full h-14 bg-surface rounded-DEFAULT border border-outline-variant px-md font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="contactName" placeholder="Ad və Soyad" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="phone">TELEFON NÖMRƏSİ *</label>
<input class="w-full h-14 bg-surface rounded-DEFAULT border border-outline-variant px-md font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="phone" placeholder="+994" type="tel"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="email">E-POÇT *</label>
<input class="w-full h-14 bg-surface rounded-DEFAULT border border-outline-variant px-md font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="nümunə@şirkət.az" type="email"/>
</div>
</div>
<!-- Additional Info -->
<div class="space-y-md pt-md">
<h2 class="font-h3 text-h3 text-primary border-b border-outline-variant/30 pb-xs mb-md">Əlavə Məlumat</h2>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="description">MAĞAZA HAQQINDA QISA MƏLUMAT</label>
<textarea class="w-full bg-surface rounded-DEFAULT border border-outline-variant p-md font-body-md text-body-md text-on-background focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="description" placeholder="Məhsullarınız və fəaliyyətiniz barədə qısaca yazın..." rows="4"></textarea>
</div>
</div>
<!-- Terms and Submit -->
<div class="pt-lg pb-xxl flex flex-col items-center">
<label class="flex items-start space-x-sm mb-lg cursor-pointer">
<div class="flex-shrink-0 pt-1">
<input class="w-5 h-5 rounded-sm border-outline text-primary focus:ring-primary bg-surface" type="checkbox"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">
<a class="text-primary underline" href="#">İstifadəçi razılaşması</a> və <a class="text-primary underline" href="#">Məxfilik siyasəti</a> ilə tanış oldum və razıyam.
                            </span>
</label>
<button class="w-full h-14 bg-primary text-on-primary font-body-lg text-body-lg font-semibold rounded-DEFAULT flex items-center justify-center shadow-[0_4px_14px_rgba(0,52,43,0.2)] hover:bg-primary-container hover:shadow-[0_6px_20px_rgba(0,52,43,0.3)] transition-all transform active:scale-95" type="button">
                            Müraciəti göndər
                        </button>
<p class="font-body-sm text-body-sm text-outline mt-md text-center">Müraciətiniz admin tərəfindən yoxlanılacaq.</p>
</div>
</form>
</div>
</section>
</main>
<!-- Footer is suppressed due to transactional intent -->
</body></html>
