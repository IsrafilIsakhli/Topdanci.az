name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Lint, test, build, and validate schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topdanbazar
          POSTGRES_PASSWORD: topdanbazar
          POSTGRES_DB: topdanbazar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U topdanbazar -d topdanbazar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://topdanbazar:topdanbazar@localhost:5433/topdanbazar?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-with-more-than-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-with-more-than-32-characters
      LEAD_HASH_SALT: test-lead-hash-salt-with-more-than-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Seed database
        run: npm run prisma:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: API e2e smoke tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: High severity production dependency audit
        run: node scripts/audit-gate.cjs
