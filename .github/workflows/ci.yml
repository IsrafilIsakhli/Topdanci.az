name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, build, and validate schema
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://topdanci:topdanci@localhost:5432/topdanci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: High severity production dependency audit
        run: npm audit --omit=dev --audit-level=high
